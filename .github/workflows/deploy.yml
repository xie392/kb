name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch: # 支持手动触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 BuildKit
        uses: docker/setup-buildx-action@v3

      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true # 加载到 runner 本地 docker，用于打包直传
          tags: kb:latest
          build-args: |
            NEXT_PUBLIC_ADMIN_BASE_PATH=${{ secrets.NEXT_PUBLIC_ADMIN_BASE_PATH }}

      - name: 打包镜像
        run: |
          docker save kb:latest | gzip > kb.tar.gz
          ls -lh kb.tar.gz

      - name: 同步部署文件到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml,Caddyfile"
          target: "/opt/kb/"
          timeout: "120s"

      - name: 传输镜像到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "kb.tar.gz"
          target: "/opt/kb/"
          timeout: "1800s" # 大文件传输，30 分钟上限

      - name: 加载镜像并启动
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: "30m"
          script: |
            set -e
            cd /opt/kb
            docker load < kb.tar.gz
            rm -f kb.tar.gz
            docker compose up -d
            docker image prune -f
