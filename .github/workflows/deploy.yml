name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 同步代码到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: ".,!.git,!node_modules,!.next,!*.db,!*.db-journal,!dev.db"
          target: "/opt/kb/"
          timeout: "300s"
          strip_components: 1

      - name: 服务器构建镜像并部署
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: "30m"
          script: |
            set -e
            cd /opt/kb

            # 创建必要目录
            mkdir -p data

            # 创建 .env（如不存在）
            if [ ! -f .env ]; then
              SECRET=$(openssl rand -base64 32)
              {
                echo "AUTH_SECRET=\"${SECRET}\""
                echo "DATABASE_URL=\"file:/data/dev.db\""
                echo "ATTACHMENT_STORAGE_DIR=\"/data/attachments\""
                echo "BACKUP_DIR=\"/data/backups\""
                echo "AUTH_TRUST_HOST=\"true\""
                echo "NEXT_PUBLIC_ADMIN_BASE_PATH=\"${ADMIN_BASE_PATH}\""
                echo "NEXT_PUBLIC_SITE_URL=\"${SITE_URL}\""
                echo "INIT_USERNAME=\"${INIT_USERNAME}\""
                echo "INIT_PASSWORD=\"${INIT_PASSWORD}\""
              } > .env
              chmod 600 .env
              echo "✅ 已创建 .env"
              echo "   初始账号：${INIT_USERNAME}"
            else
              echo "ℹ️ .env 已存在"
            fi
            chmod 600 .env

            # 构建镜像
            docker build -t kb:latest .

            # 启动服务
            docker compose up -d

            # 清理
            docker builder prune -f

            echo "✅ 部署完成"
          envs: ADMIN_BASE_PATH,SITE_URL,INIT_USERNAME,INIT_PASSWORD
        env:
          ADMIN_BASE_PATH: ${{ secrets.NEXT_PUBLIC_ADMIN_BASE_PATH }}
          SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          INIT_USERNAME: ${{ secrets.INIT_USERNAME }}
          INIT_PASSWORD: ${{ secrets.INIT_PASSWORD }}
