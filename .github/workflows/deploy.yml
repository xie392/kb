name: Deploy to Server

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 通过 SSH 在服务器执行部署
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: "30m"
          envs: ADMIN_BASE_PATH,SITE_URL,INIT_USERNAME,INIT_PASSWORD
          script: |
            set -e
            DEPLOY_DIR="/opt/kb"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            # 1. 先拉取/更新 repo 拿到最新的 deploy.sh 和配置
            if [ ! -d repo/.git ]; then
              rm -rf repo
              git clone --depth 1 -b master https://github.com/xie392/kb.git repo
            else
              cd repo && git fetch origin master && git reset --hard origin/master && cd ..
            fi

            # 2. 首次部署：复制 docker-compose.yml 和 Caddyfile 到部署根目录
            if [ ! -f docker-compose.yml ]; then
              cp repo/docker-compose.yml ./
            fi
            if [ ! -f Caddyfile ]; then
              cp repo/Caddyfile ./
            fi

            # 3. 执行一键部署脚本
            bash repo/deploy.sh
        env:
          ADMIN_BASE_PATH: ${{ secrets.NEXT_PUBLIC_ADMIN_BASE_PATH }}
          SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          INIT_USERNAME: ${{ secrets.INIT_USERNAME }}
          INIT_PASSWORD: ${{ secrets.INIT_PASSWORD }}
