name: Deploy to Server

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 海外机器打包源码（几 MB），避免国内服务器访问 npm/GitHub 慢
      - name: 打包源码
        run: |
          tar czf /tmp/source.tar.gz \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=.git \
            --exclude='public/uploads' \
            --exclude='./data' \
            --exclude='*.db' \
            --exclude='*.db-journal' \
            --exclude='.env*' \
            .
          mv /tmp/source.tar.gz source.tar.gz
          ls -lh source.tar.gz

      - name: 同步源码包到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "source.tar.gz"
          target: "/opt/kb/"
          timeout: "300s"

      - name: 服务器解压并部署
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: "30m"
          envs: ADMIN_BASE_PATH,SITE_URL,INIT_USERNAME,INIT_PASSWORD
          script: |
            set -e
            cd /opt/kb
            mkdir -p data

            # 解压源码到 repo 目录
            rm -rf repo
            mkdir repo
            tar xzf source.tar.gz -C repo
            rm -f source.tar.gz

            # 首次部署：复制配置文件
            if [ ! -f docker-compose.yml ]; then
              cp repo/docker-compose.yml ./
            fi
            if [ ! -f Caddyfile ]; then
              cp repo/Caddyfile ./
            fi

            # 执行部署脚本
            bash repo/deploy.sh
        env:
          ADMIN_BASE_PATH: ${{ secrets.NEXT_PUBLIC_ADMIN_BASE_PATH }}
          SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          INIT_USERNAME: ${{ secrets.INIT_USERNAME }}
          INIT_PASSWORD: ${{ secrets.INIT_PASSWORD }}
