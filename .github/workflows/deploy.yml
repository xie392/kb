name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: kb:latest
          build-args: |
            NEXT_PUBLIC_ADMIN_BASE_PATH=${{ secrets.NEXT_PUBLIC_ADMIN_BASE_PATH }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}

      - name: 打包镜像
        run: |
          docker save kb:latest | gzip > kb.tar.gz
          ls -lh kb.tar.gz

      - name: 同步部署文件到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml,Caddyfile"
          target: "/opt/kb/"
          timeout: "120s"

      - name: 传输镜像到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "kb.tar.gz"
          target: "/opt/kb/"
          timeout: "1800s"

      - name: 加载镜像并启动
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: "30m"
          script: |
            set -e
            cd /opt/kb
            mkdir -p data
            if [ ! -f .env ]; then
              SECRET=$(openssl rand -base64 32)
              {
                echo "AUTH_SECRET=\"${SECRET}\""
                echo "DATABASE_URL=\"file:/data/dev.db\""
                echo "ATTACHMENT_STORAGE_DIR=\"/data/attachments\""
                echo "BACKUP_DIR=\"/data/backups\""
                echo "AUTH_TRUST_HOST=\"true\""
                echo "NEXT_PUBLIC_ADMIN_BASE_PATH=\"${ADMIN_BASE_PATH}\""
                echo "NEXT_PUBLIC_SITE_URL=\"${SITE_URL}\""
                echo "INIT_USERNAME=\"${INIT_USERNAME}\""
                echo "INIT_PASSWORD=\"${INIT_PASSWORD}\""
              } > .env
              chmod 600 .env
              echo "✅ 已创建 .env"
              echo "   初始账号：${INIT_USERNAME}"
            else
              echo "ℹ️ .env 已存在"
            fi
            chmod 600 .env
            docker load < kb.tar.gz
            rm -f kb.tar.gz
            docker compose up -d
            docker image prune -f
            echo "✅ 部署完成"
          envs: ADMIN_BASE_PATH,SITE_URL,INIT_USERNAME,INIT_PASSWORD
        env:
          ADMIN_BASE_PATH: ${{ secrets.NEXT_PUBLIC_ADMIN_BASE_PATH }}
          SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          INIT_USERNAME: ${{ secrets.INIT_USERNAME }}
          INIT_PASSWORD: ${{ secrets.INIT_PASSWORD }}
