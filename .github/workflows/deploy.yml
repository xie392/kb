name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 打包源码：排除大目录和本地状态，只保留构建所需文件
      # 跨国只传源码（几 MB），不传镜像（几百 MB）
      # 输出到 /tmp 避开当前目录，否则 tar 会报 "file changed as we read it"
      - name: 打包源码
        run: |
          tar czf /tmp/source.tar.gz \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=.git \
            --exclude='public/uploads' \
            --exclude='./data' \
            --exclude='*.db' \
            --exclude='*.db-journal' \
            --exclude='.env*' \
            .
          mv /tmp/source.tar.gz source.tar.gz
          ls -lh source.tar.gz

      - name: 同步源码与部署文件到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "source.tar.gz,docker-compose.yml,Caddyfile"
          target: "/opt/kb/"
          timeout: "300s"

      - name: 服务器构建并启动
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: "30m"
          envs: ADMIN_BASE_PATH,SITE_URL,INIT_USERNAME,INIT_PASSWORD
          script: |
            set -e
            cd /opt/kb
            mkdir -p data

            # 解压源码到 repo 目录（先清空旧文件）
            rm -rf repo && mkdir repo
            tar xzf source.tar.gz -C repo
            rm -f source.tar.gz

            # 初始化 .env（仅首次）
            if [ ! -f .env ]; then
              SECRET=$(openssl rand -base64 32)
              {
                echo "AUTH_SECRET=\"${SECRET}\""
                echo "DATABASE_URL=\"file:/data/dev.db\""
                echo "ATTACHMENT_STORAGE_DIR=\"/data/attachments\""
                echo "BACKUP_DIR=\"/data/backups\""
                echo "AUTH_TRUST_HOST=\"true\""
                echo "NEXT_PUBLIC_ADMIN_BASE_PATH=\"${ADMIN_BASE_PATH}\""
                echo "NEXT_PUBLIC_SITE_URL=\"${SITE_URL}\""
                echo "INIT_USERNAME=\"${INIT_USERNAME}\""
                echo "INIT_PASSWORD=\"${INIT_PASSWORD}\""
              } > .env
              chmod 600 .env
              echo "✅ 已创建 .env"
              echo "   初始账号：${INIT_USERNAME}"
            else
              echo "ℹ️ .env 已存在"
            fi
            chmod 600 .env

            # 在 repo 目录构建镜像
            # Dockerfile 多阶段构建会自己装 python3/make/g++，宿主机不需要
            cd repo
            docker build \
              --build-arg NEXT_PUBLIC_ADMIN_BASE_PATH="${ADMIN_BASE_PATH}" \
              --build-arg NEXT_PUBLIC_SITE_URL="${SITE_URL}" \
              -t kb:latest .

            # 启动（docker-compose.yml 在 /opt/kb 下，image 用本地 kb:latest）
            cd /opt/kb
            docker compose up -d
            docker image prune -f

            # 清理构建产物：源码已打进镜像，repo 目录不再需要
            rm -rf repo
            echo "✅ 部署完成"
        env:
          ADMIN_BASE_PATH: ${{ secrets.NEXT_PUBLIC_ADMIN_BASE_PATH }}
          SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          INIT_USERNAME: ${{ secrets.INIT_USERNAME }}
          INIT_PASSWORD: ${{ secrets.INIT_PASSWORD }}
