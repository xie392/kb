services:
  kb:
    image: kb:latest
    container_name: kb
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    volumes:
      - ./data:/data
    networks:
      - kb-net

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - kb
    networks:
      - kb-net

volumes:
  caddy_data:
  caddy_config:

networks:
  kb-net:
